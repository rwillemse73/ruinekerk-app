<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reisblik – Mijn reisdag</title>
<style>
body{margin:0;background:#f3f0e8;color:#17384a;font-family:Arial,sans-serif;}
.page{max-width:1000px;margin:28px auto;padding:0 20px;}
.header{background:#26353a;color:#fff;border-radius:12px;padding:18px 20px;}
.header h1{margin:0;font-size:28px;}
.version{font-size:13px;font-weight:normal;opacity:.8;margin-left:8px;}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;}
.nav button{background:#26353a;color:#fff;border:0;border-radius:9px;padding:10px 15px;font-size:15px;font-weight:600;cursor:pointer;}
.card{background:#fff;border:1px solid #cfd8dc;border-radius:12px;padding:22px;margin-top:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.card h2{margin-top:0;}
.note{color:#61747d;line-height:1.5;}
</style>
</head>
<body>
<div class="page">
  <div class="header">
    <h1>📖 Mijn reisdag <span class="version">Reisblik 9.9.47</span></h1>
  </div>
  <div class="nav">
    <button type="button" id="backStartBtn">← Terug naar startscherm</button>
    <button type="button" id="backAppBtn">← Terug naar Reisblik</button>
  </div>
  <div class="card">
    <h2>Mijn reisdag</h2>
    <p class="note">Deze aparte pagina is nu aangemaakt als nieuwe plaats voor de functies van Mijn reisdag.</p>
    <p class="note"><strong>Op dit moment zijn er nog geen functies verplaatst.</strong> De bestaande Mijn-reisdagfuncties blijven dus gewoon op hun huidige plaats werken.</p>
  </div>
</div>
<script>
document.getElementById('backStartBtn').addEventListener('click',()=>{location.href='index.html';});
document.getElementById('backAppBtn').addEventListener('click',()=>{location.href='app.html#open';});
</script>
</body>
</html>
