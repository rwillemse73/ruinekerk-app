<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MFG-ART</title><style>
body{margin:0;font-family:Arial,sans-serif;color:#302b27;line-height:1.45;font-size:15px}main{max-width:780px;margin:auto;padding:20px 22px 24px}h1{color:#6b513c;font-size:1.8rem;margin:0 0 4px}h2{color:#6b513c;font-size:1.08rem;margin:14px 0 5px}p{margin:4px 0}table{width:100%;border-collapse:collapse;margin-top:5px}td{padding:5px 7px;border-bottom:1px solid #ddd5cc;vertical-align:top}td:first-child{font-weight:700;width:30%}.intro{margin:7px 0 10px}a{color:#6b513c}</style></head>
<body><main data-location-type="kunst"><h1>🎨 MFG-ART</h1><p><strong>Kunstgalerie</strong></p>
<h2>🎨 Over de locatie</h2><p class="intro">Kunstgalerie; actuele expositie-informatie controleren.</p>
<h2>🖼️ Wat wordt getoond?</h2><p>Kunstgalerie; actuele expositie-informatie controleren.</p>
<h2>📋 Gegevens</h2><table>
<tr><td>Type</td><td>Kunstgalerie</td></tr><tr><td>Adres</td><td>Drift 2, 3941 HL Doorn</td></tr>
<tr><td>Telefoon</td><td>+31 6 460 81 292</td></tr>
<tr><td>Website</td><td>Niet vastgesteld</td></tr></table><div id="location-data" hidden data-location-id="mfg-art" data-location-type="kunst" data-lat="52.03620000" data-lon="5.34300000" data-gps-status="adres-gebaseerd"></div></main>
<style id="reisblik-visited-style">
.reisblik-bezocht{
  display:inline-flex;align-items:center;gap:6px;
  margin:8px 0 16px;padding:9px 13px;
  border:1px solid #b9c0c3;border-radius:9px;
  background:#fff;color:#26353a;font:inherit;cursor:pointer;
}
.reisblik-bezocht:hover{filter:brightness(.97)}
</style>
<script>
(function(){
  const KEY='reisblik_visited_v1';
  const dataEl=document.getElementById('location-data');
  if(!dataEl)return;
  const id=dataEl.dataset.locationId;
  if(!id)return;
  const main=document.querySelector('main');
  if(!main)return;

  function load(){
    try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}
  }
  function save(d){localStorage.setItem(KEY,JSON.stringify(d))}
  function fmt(iso){
    return new Intl.DateTimeFormat('nl-NL',{dateStyle:'short',timeStyle:'short'}).format(new Date(iso));
  }
  const name=(main.querySelector('h1')?.textContent||id).trim();
  const type=(dataEl.dataset.locationType||'').trim();

  const b=document.createElement('button');
  b.type='button';
  b.className='reisblik-bezocht';

  function refresh(){
    const d=load(), v=d[id];
    b.textContent=v ? '☑ Bezocht — '+fmt(v.visitedAt) : '☐ Bezocht';
    b.setAttribute('aria-pressed',v?'true':'false');
  }
  b.addEventListener('click',function(){
    const d=load();
    if(d[id]){
      delete d[id];
    }else{
      d[id]={
        id:id,
        name:name,
        category:type,
        visitedAt:new Date().toISOString()
      };
    }
    save(d);
    refresh();
  });

  // Plaats de knop direct onder de eerste inleidende alinea na de titel.
  const h1=main.querySelector('h1');
  let intro=h1 ? h1.nextElementSibling : null;
  while(intro && intro.tagName!=='P') intro=intro.nextElementSibling;
  if(intro) intro.insertAdjacentElement('afterend',b);
  else if(h1) h1.insertAdjacentElement('afterend',b);
  else main.insertBefore(b,main.firstChild);

  refresh();
})();
</script>

</body></html>
