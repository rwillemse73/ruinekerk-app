<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reisblik – Praag Locaties Diagnostiek</title>
<style>
body{font-family:Calibri,Arial,sans-serif;margin:0;background:#f4f1ea;color:#26353a}
header{background:#fff;padding:16px;border-bottom:1px solid #ddd}
h1{margin:0 0 6px;font-size:22px}.sub{color:#68777b;font-size:13px}
main{padding:14px;max-width:1100px;margin:auto}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin:10px 0}
.ok{border-left:6px solid #2e7d32}.fail{border-left:6px solid #c62828}.warn{border-left:6px solid #ef6c00}
.row{margin:5px 0;word-break:break-all}.label{font-weight:700}
code{background:#eee;padding:2px 4px;border-radius:4px}
button{padding:9px 12px;border:0;border-radius:8px;background:#26353a;color:#fff;cursor:pointer}
pre{white-space:pre-wrap;word-break:break-word;background:#f7f6f2;padding:10px;border-radius:8px}
</style>
</head>
<body>
<header>
<h1>🔎 Reisblik – Praag Locaties Diagnostiek</h1>
<div class="sub">Deze pagina wijzigt niets. Hij laat exact zien welke URL de huidige categorie-logica probeert te gebruiken.</div>
</header>
<main>
<button onclick="run()">Opnieuw testen</button>
<div id="summary" class="card">Test wordt gestart…</div>
<div id="results"></div>
</main>
<script>
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}

async function run(){
 const summary=document.getElementById('summary');
 const results=document.getElementById('results');
 results.innerHTML='';
 summary.textContent='locaties/locaties.json wordt opgehaald…';

 // Dit is exact de categoriebron van de gezamenlijke index wanneer deze pagina
 // vanuit /praag/ wordt geopend.
 const categorySource='locaties/locaties.json';
 const categoryBase=new URL(categorySource,location.href);

 let data;
 try{
   const r=await fetch(categorySource+'?diag='+Date.now(),{cache:'no-store'});
   if(!r.ok) throw new Error('HTTP '+r.status);
   data=await r.json();
 }catch(e){
   summary.className='card fail';
   summary.innerHTML='<b>FOUT:</b> locaties/locaties.json kon niet worden geladen.<br><code>'+esc(e.message)+'</code>';
   return;
 }

 const items=Array.isArray(data.locations)?data.locations:[];
 let ok=0,fail=0;
 summary.className='card';
 summary.innerHTML='<b>JSON gevonden.</b> '+items.length+' locatie(s).<br>'+
   'Indexpagina: <code>'+esc(location.href)+'</code><br>'+
   'Categoriebron: <code>'+esc(categorySource)+'</code><br>'+
   'Category base: <code>'+esc(categoryBase.href)+'</code>';

 for(const x of items){
   const content=x.content ?? x.html ?? x.file;
   const currentUrl=new URL(String(content),categoryBase).href;
   let status='', title='', article=false, err='';
   try{
     const r=await fetch(currentUrl+'?diag='+Date.now(),{cache:'no-store'});
     status='HTTP '+r.status;
     if(!r.ok) throw new Error(status);
     const text=await r.text();
     const doc=new DOMParser().parseFromString(text,'text/html');
     title=doc.title||'';
     article=!!doc.querySelector('article');
     ok++;
   }catch(e){
     fail++;
     err=e.message||String(e);
   }

   // Extra controle: test dezelfde bestandsnaam ook relatief aan de app-root.
   // Dit is alleen diagnostiek, niet de normale route.
   const rootRelative=new URL(String(content),location.href).href;
   let rootStatus='';
   try{
     const rr=await fetch(rootRelative+'?diag='+Date.now(),{cache:'no-store'});
     rootStatus='HTTP '+rr.status;
   }catch(e){rootStatus='FETCH FOUT: '+(e.message||e)}

   const cls=err?'fail':'ok';
   const card=document.createElement('div');
   card.className='card '+cls;
   card.innerHTML=
    '<h2>'+esc(x.name??x.naam??x.id)+'</h2>'+
    '<div class="row"><span class="label">JSON content:</span> <code>'+esc(content)+'</code></div>'+
    '<div class="row"><span class="label">URL die huidige index maakt:</span><br><code>'+esc(currentUrl)+'</code></div>'+
    '<div class="row"><span class="label">Resultaat:</span> '+esc(status)+'</div>'+
    '<div class="row"><span class="label">article gevonden:</span> '+(article?'JA':'NEE')+'</div>'+
    '<div class="row"><span class="label">HTML title:</span> '+esc(title||'(leeg)')+'</div>'+
    '<div class="row"><span class="label">Alternatieve root-test:</span> '+esc(rootRelative)+' → '+esc(rootStatus)+'</div>'+
    (err?'<pre>'+esc(err)+'</pre>':'');
   results.appendChild(card);
 }

 summary.innerHTML += '<hr><b>Uitkomst:</b> '+ok+' HTML-bestanden rechtstreeks gevonden, '+fail+' niet gevonden via de URL die de huidige index gebruikt.';
 if(fail===0) summary.className='card ok';
 else summary.className='card fail';
}
run();
</script>
</body>
</html>
