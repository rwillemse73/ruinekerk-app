<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruïnekerk app – proef v1.3.1</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4f1ea;color:#26353a}
header{background:#fff;padding:15px;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:1000;position:relative}
h1{margin:0;font-size:20px}.sub{font-size:12px;color:#6c777b}
.version{position:absolute;right:14px;top:14px;font-size:11px;color:#6c777b;background:#eee;padding:5px 8px;border-radius:12px}
#map{height:52vh;min-height:350px}.panel{padding:14px}
button{padding:10px 13px;border:0;border-radius:10px;background:#26353a;color:#fff;margin:3px}
.status{font-size:13px;margin:8px 3px}.card{background:#fff;border-radius:14px;padding:14px;margin:10px 0;border:1px solid #ddd}
.card h2{margin:0 0 4px}.meta{font-size:12px;color:#6c777b}.story{font-size:14px;line-height:1.55;margin-top:8px}
.error{background:#ffe2e2;padding:12px;border-radius:10px;margin:10px 0;font-size:13px}
.content-meta{font-size:11px;color:#6c777b;background:#f0eee9;padding:8px;border-radius:9px;margin-top:8px}
.note-item{border-left:3px solid #bbb;padding:7px 9px;margin:7px 0;background:#f7f6f2;border-radius:7px;font-size:13px}
.note-type{font-size:11px;color:#6c777b;text-transform:uppercase}
</style>
</head>
<body>
<header><h1>Ruïnekerk app</h1><div class="sub">Schone eerste proef</div><div class="version">app v1.3.1</div></header>
<div id="map"></div>
<div class="panel">
<button onclick="testPosition()">🧪 Testpositie</button>
<button onclick="myPosition()">📍 Mijn locatie</button>
<button onclick="showAll()">🗺️ Alle locaties</button>
<div id="status" class="status">Locaties worden geladen…</div>
<div id="message"></div>
<div id="locations"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let locations=[];
let userLat=null,userLon=null;
let map=L.map('map').setView([52.72,4.88],13);
let markers=[]; let userMarker=null; let userCircle=null;

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
 maxZoom:19,attribution:'© OpenStreetMap contributors'
}).addTo(map);

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}

function distance(a,b,c,d){
 const R=6371000,p=Math.PI/180,A=(c-a)*p,B=(d-b)*p;
 const q=Math.sin(A/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(B/2)**2;
 return 2*R*Math.atan2(Math.sqrt(q),Math.sqrt(1-q));
}

function formatDistance(n){return n<1000?Math.round(n)+' m':(n/1000).toFixed(1)+' km';}

async function loadLocations(){
 try{
  const response=await fetch('locaties.json?v='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const data=await response.json();
  locations=data.locations||[];
  document.getElementById('message').innerHTML=
   '<div class="status">✓ locaties.json geladen · versie '+esc(data.version)+'</div>';
  drawMarkers();
  render();
 }catch(e){
  document.getElementById('status').textContent='Locaties konden niet worden geladen.';
  document.getElementById('message').innerHTML=
   '<div class="error">Fout: locaties.json is niet gevonden. Controleer of het bestand naast index.html staat.</div>';
 }
}

function drawMarkers(){
 markers.forEach(m=>map.removeLayer(m));markers=[];
 locations.forEach(x=>{
  if(x.lat==null||x.lon==null)return;
  const m=L.marker([x.lat,x.lon]).addTo(map)
   .bindPopup('<b>'+esc(x.name)+'</b><br>'+esc(x.address||''));
  markers.push(m);
 });
}

function render(){
 if(userLat===null){
  document.getElementById('locations').innerHTML=
   '<div class="card">Druk op 🧪 Testpositie om de app thuis te testen.</div>';
  return;
 }
 const nearby=locations.map(x=>({...x,distance:distance(userLat,userLon,x.lat,x.lon)}))
  .sort((a,b)=>a.distance-b.distance);
 const within=nearby.filter(x=>x.distance<=500);
 document.getElementById('status').textContent=
  within.length+' locatie(s) binnen 500 meter · 250 m is de verhaalzone · positie '+userLat.toFixed(5)+', '+userLon.toFixed(5);

 document.getElementById('locations').innerHTML=within.length?
  within.map(x=>`
   <div class="card">
    <h2>${esc(x.name)}</h2>
    <div class="meta">${esc(x.type)} · ${esc(x.address||'')}</div>
    <div style="font-size:22px;font-weight:700;margin:8px 0">
      📍 ${formatDistance(x.distance)}
      <span style="font-size:13px;font-weight:400;color:#6c777b"> vanaf jouw positie</span>
    </div>
    <div class="story" id="story-${esc(x.id)}">
     ${x.distance<=250
       ? 'Verhaal wordt geladen…'
       : '<span class="small">Je bent buiten de 250-meterzone.</span><br><button type="button" onclick="loadStoryById(\''+x.id+'\')">📖 Bekijk verhaal</button>'}
    </div>
   </div>`).join(''):
  '<div class="card">Geen locaties binnen 500 meter.</div>';

 within.filter(x=>x.distance<=250).forEach(loadStory);
}

async function loadStoryById(id){
 const x=locations.find(a=>a.id===id);
 if(x) await loadStory(x,true);
}

async function loadStory(x,explicit=false){
 const el=document.getElementById('story-'+x.id);if(!el)return;
 try{
  const response=await fetch(x.content+'?v='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw new Error();
  const text=await response.text();
  const doc=new DOMParser().parseFromString(text,'text/html');
  const article=doc.querySelector('article');
  el.innerHTML=(article?.innerHTML||doc.body.innerHTML)+
   '<div class="content-meta">'+
   (explicit && typeof x.distance==='number' && x.distance>250 ? '📍 Je bent '+formatDistance(x.distance)+' van deze locatie · verhaal bewust geopend buiten 250 m.<br>' : '')+
   'Tekst vastgelegd: <b>22 augustus 2026</b> · Contentversie: <b>v1.1</b></div>';
 }catch(e){el.textContent='Het locatieverhaal kon niet worden geladen.';}
}

function openNotes(id){
 const x=locations.find(a=>a.id===id); if(!x)return;
 window.currentNoteLocation=id;
 document.getElementById('notesTitle').textContent='📝 Mijn testnotities – '+x.name;
 renderNotes();
 document.getElementById('notesModal').style.display='block';
}
function closeNotes(){document.getElementById('notesModal').style.display='none';}
function getNotes(){
 return JSON.parse(localStorage.getItem('ruinekerk_test_notes_v1')||'{}');
}
function renderNotes(){
 const all=getNotes(), notes=all[window.currentNoteLocation]||[];
 document.getElementById('notesList').innerHTML=notes.length?
  notes.map(n=>`<div class="note-item">
   <div class="note-type">${esc(n.type)} · ${esc(n.date)}</div>
   <div>${esc(n.text)}</div>
  </div>`).join(''):
  '<div class="small">Nog geen testnotities bij deze locatie.</div>';
}
function saveNote(){
 const text=document.getElementById('noteText').value.trim();
 if(!text){alert('Schrijf eerst een notitie.');return;}
 const all=getNotes();
 all[window.currentNoteLocation]=all[window.currentNoteLocation]||[];
 all[window.currentNoteLocation].push({
  date:new Date().toLocaleDateString('nl-NL'),
  type:document.getElementById('noteType').value,
  text:text
 });
 localStorage.setItem('ruinekerk_test_notes_v1',JSON.stringify(all));
 document.getElementById('noteText').value='';
 renderNotes();
}

function testPosition(){
 userLat=52.719804;userLon=4.878203;
 updateUserMarker();
 map.setView([userLat,userLon],15);render();
}

function myPosition(){
 if(!navigator.geolocation){alert('GPS wordt niet ondersteund.');return;}
 navigator.geolocation.getCurrentPosition(
  p=>{userLat=p.coords.latitude;userLon=p.coords.longitude;updateUserMarker();map.setView([userLat,userLon],16);render();},
  ()=>alert('Locatie kon niet worden bepaald. Controleer de locatie-toestemming.')
 );
}

function showAll(){
 if(markers.length)map.fitBounds(L.featureGroup(markers).getBounds().pad(.25));
}

loadLocations();
</script>
</body>
</html>
