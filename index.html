<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruïnekerk app – proef v1.7</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4f1ea;color:#26353a}
header{background:#fff;padding:15px;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:1000;position:relative}
h1{margin:0;font-size:20px}.sub{font-size:12px;color:#6c777b}
.version{position:absolute;right:14px;top:14px;font-size:11px;color:#6c777b;background:#eee;padding:5px 8px;border-radius:12px}
#map{height:52vh;min-height:350px}.panel{padding:14px}
button{padding:10px 13px;border:0;border-radius:10px;background:#26353a;color:#fff;margin:3px}
.status{font-size:13px;margin:8px 3px}.card{background:#fff;border-radius:14px;padding:14px;margin:10px 0;border:1px solid #ddd}
.card h2{margin:0 0 4px}.meta{font-size:12px;color:#6c777b}.story{font-size:14px;line-height:1.55;margin-top:8px}
.error{background:#ffe2e2;padding:12px;border-radius:10px;margin:10px 0;font-size:13px}
.content-meta{font-size:11px;color:#6c777b;background:#f0eee9;padding:8px;border-radius:9px;margin-top:8px}.extra-info{margin-top:12px;padding-top:10px;border-top:1px solid #eee}.extra-item{background:#f7f6f2;border-radius:9px;padding:9px;margin:7px 0;font-size:13px}.extra-date{font-size:11px;color:#6c777b;font-weight:600}.extra-info{margin-top:12px;padding-top:10px;border-top:1px solid #eee}.extra-item{background:#f7f6f2;border-radius:9px;padding:9px;margin:7px 0;font-size:13px}.extra-date{font-size:11px;color:#6c777b;font-weight:600}.notes{margin-top:12px;padding-top:10px;border-top:1px solid #eee}.note{background:#f7f6f2;border-radius:9px;padding:8px;margin:7px 0;font-size:13px}.notehead{font-size:11px;color:#6c777b;font-weight:600}
</style>
</head>
<body>
<header><h1>Ruïnekerk app</h1><div class="sub">Schone eerste proef</div><div class="version">app v1.7</div></header>
<div id="map"></div>
<div class="panel">
<button onclick="testPosition()">🧪 Testpositie</button>
<button onclick="myPosition()">📍 Mijn locatie</button>
<button onclick="showAll()">🗺️ Alle locaties</button><button onclick="openAddLocation()">➕ Locatie toevoegen</button>
<div id="status" class="status">Locaties worden geladen…</div>
<div id="message"></div>
<div id="locations"></div>
</div>

<div id="noteModal" style="display:none;position:fixed;inset:0;background:#0008;z-index:3000;padding:14px;overflow:auto">
<div style="background:#fff;border-radius:16px;padding:16px;max-width:650px;margin:20px auto">
<h2 id="noteTitle">Notitie</h2>
<label>Type</label><select id="noteType"><option value="opmerking">Opmerking</option><option value="idee">Idee voor tekst</option><option value="beoordeling">Beoordeling</option></select>
<label>Datum</label><input id="noteDate" type="date">
<label>Tekst</label><textarea id="noteText" placeholder="Schrijf je opmerking, idee of beoordeling…"></textarea>
<button type="button" onclick="saveNote()">Opslaan</button>
<button type="button" onclick="closeNote()" style="background:#e8e5df;color:#26353a">Annuleren</button>
<div id="noteExisting"></div></div></div><div id="extraModal" style="display:none;position:fixed;inset:0;background:#0008;z-index:3000;padding:14px;overflow:auto">
<div style="background:#fff;border-radius:16px;padding:16px;max-width:650px;margin:20px auto">
<h2 id="extraTitle">Extra informatie</h2>
<label>Datum</label>
<input id="extraDate" type="date">
<label>Extra informatie</label>
<textarea id="extraText" placeholder="Voeg hier aanvullende informatie toe…"></textarea>
<button type="button" onclick="saveExtraInfo()">Opslaan</button>
<button type="button" onclick="closeExtraInfo()" style="background:#e8e5df;color:#26353a">Annuleren</button>
<div id="extraExisting"></div>
</div></div>
<div id="addLocationModal" style="display:none;position:fixed;inset:0;background:#0008;z-index:3000;padding:14px;overflow:auto">
<div style="background:#fff;border-radius:16px;padding:16px;max-width:650px;margin:20px auto">
<h2>➕ Locatie toevoegen</h2>
<p class="meta">Voeg een eigen locatie toe. Het adres wordt omgezet naar GPS-coördinaten.</p>
<label>Naam</label>
<input id="newName" placeholder="Bijvoorbeeld: Restaurant De Waag" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:9px">
<label>Adres</label>
<input id="newAddress" placeholder="Straat, huisnummer, postcode, plaats" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:9px">
<label>Type</label>
<select id="newType" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:9px">
<option>restaurant</option><option>cafe</option><option>hotel</option><option>bezienswaardigheid</option><option>natuur</option><option>historie</option><option>eigen herinnering</option>
</select>
<div id="geocodeResult" class="status"></div>
<button type="button" onclick="findAddress()">📍 Adres zoeken</button>
<button type="button" onclick="saveNewLocation()">Opslaan</button>
<button type="button" onclick="closeAddLocation()" style="background:#e8e5df;color:#26353a">Annuleren</button>
</div></div>
<div id="extraModal" style="display:none;position:fixed;inset:0;background:#0008;z-index:3000;padding:14px;overflow:auto">
<div style="background:#fff;border-radius:16px;padding:16px;max-width:650px;margin:20px auto">
<h2 id="extraTitle">Extra informatie</h2>
<label>Datum</label><input id="extraDate" type="date">
<label>Extra informatie</label><textarea id="extraText" placeholder="Voeg hier aanvullende informatie toe…"></textarea>
<button type="button" onclick="saveExtraInfo()">Opslaan</button>
<button type="button" onclick="closeExtraInfo()" style="background:#e8e5df;color:#26353a">Annuleren</button>
<div id="extraExisting"></div>
</div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let locations=[];
let userLat=null,userLon=null;
let map=L.map('map').setView([52.72,4.88],13);
let markers=[];
let userMarker=null,userCircle=null;

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
 maxZoom:19,attribution:'© OpenStreetMap contributors'
}).addTo(map);

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function distance(a,b,c,d){
 const R=6371000,p=Math.PI/180,A=(c-a)*p,B=(d-b)*p;
 const q=Math.sin(A/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(B/2)**2;
 return 2*R*Math.atan2(Math.sqrt(q),Math.sqrt(1-q));
}
function formatDistance(n){return n<1000?Math.round(n)+' m':(n/1000).toFixed(1)+' km';}

async function loadLocations(){
 try{
  const response=await fetch('locaties.json?v='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const data=await response.json();
  locations=(data.locations||[]).concat(getUserLocations());
  document.getElementById('message').innerHTML='<div class="status">✓ locaties.json geladen · versie '+esc(data.version)+'</div>';
  drawMarkers();render();
 }catch(e){
  document.getElementById('status').textContent='Locaties konden niet worden geladen.';
  document.getElementById('message').innerHTML='<div class="error">Fout: locaties.json is niet gevonden.</div>';
 }
}
function drawMarkers(){
 markers.forEach(m=>map.removeLayer(m));markers=[];
 locations.forEach(x=>{
  if(x.lat==null||x.lon==null)return;
  const m=L.marker([x.lat,x.lon]).addTo(map).bindPopup('<b>'+esc(x.name)+'</b><br>'+esc(x.address||''));
  m.on('click',()=>openLocationFromMap(x.id));
  markers.push(m);
 });
}
function updateUserMarker(){
 if(userLat==null)return;
 if(userMarker)map.removeLayer(userMarker);
 if(userCircle)map.removeLayer(userCircle);
 userMarker=L.circleMarker([userLat,userLon],{radius:8,weight:3,fillOpacity:.9}).addTo(map).bindPopup('<b>Jouw positie</b>');
 userCircle=L.circle([userLat,userLon],{radius:250,weight:1,fillOpacity:.05}).addTo(map);
}
function render(){
 if(userLat===null){
  document.getElementById('locations').innerHTML='<div class="card">Druk op 🧪 Testpositie om de app thuis te testen.</div>';
  return;
 }
 const nearby=locations.map(x=>({...x,distance:distance(userLat,userLon,x.lat,x.lon)})).sort((a,b)=>a.distance-b.distance);
 const within=nearby.filter(x=>x.distance<=500);
 document.getElementById('status').textContent=within.length+' locatie(s) binnen 500 meter · 250 m is de verhaalzone · positie '+userLat.toFixed(5)+', '+userLon.toFixed(5);
 document.getElementById('locations').innerHTML=within.length?
  within.map(x=>`
   <div class="card" id="card-${esc(x.id)}">
    <h2>${esc(x.name)}</h2>
    <div class="meta">${esc(x.type)} · ${formatDistance(x.distance)} · ${esc(x.address||'')}</div>
    <div style="font-size:22px;font-weight:700;margin:8px 0">📍 ${formatDistance(x.distance)}
      <span style="font-size:13px;font-weight:400;color:#6c777b"> vanaf jouw positie</span>
    </div>
    <div class="story" id="story-${esc(x.id)}">
      ${x.distance<=250?'Verhaal wordt geladen…':'<span class="meta">Buiten 250 meter — klik op de locatie om het verhaal te bekijken.</span>'}
    </div>
    <div class="extra-info">
      <button type="button" onclick="openExtraInfo('${esc(x.id)}')">➕ Extra informatie</button>
      <div id="extra-${esc(x.id)}"></div>
    </div>
   </div>`).join(''):
  '<div class="card">Geen locaties binnen 500 meter.</div>';
 within.filter(x=>x.distance<=250).forEach(x=>loadStory(x,false)); renderAllExtraInfo(); renderAllNotes(); renderAllExtraInfo();
}
async function loadStory(x,clicked){
 const el=document.getElementById('story-'+x.id);if(!el)return;
 try{
  const response=await fetch(x.content+'?v='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw new Error();
  const text=await response.text();
  const doc=new DOMParser().parseFromString(text,'text/html');
  el.innerHTML=(doc.querySelector('article')?.innerHTML||doc.body.innerHTML)+
   '<div class="content-meta">Tekst vastgelegd: <b>22 augustus 2026</b> · Contentversie: <b>v1.1</b></div>';
 }catch(e){el.textContent='Het locatieverhaal kon niet worden geladen.';}
}
function openLocationFromMap(id){
 const x=locations.find(a=>a.id===id);if(!x)return;
 if(userLat!==null)x.distance=distance(userLat,userLon,x.lat,x.lon);
 const card=document.getElementById('card-'+id);
 if(card)card.scrollIntoView({behavior:'smooth'});
 if(x.distance<=250){
  loadStory(x,false);
 }else{
  loadStory(x,true);
 }
}
let extraLocationId=null;
function getExtraInfo(){try{return JSON.parse(localStorage.getItem('ruinekerk_extra_info_v1')||'{}')}catch(e){return {}}}
function openExtraInfo(id){
 extraLocationId=id;const x=locations.find(a=>a.id===id);
 document.getElementById('extraTitle').textContent='➕ Extra informatie – '+(x?x.name:'Locatie');
 document.getElementById('extraDate').value=new Date().toISOString().slice(0,10);
 document.getElementById('extraText').value='';
 renderExtraExisting();document.getElementById('extraModal').style.display='block';
}
function closeExtraInfo(){document.getElementById('extraModal').style.display='none'}
function saveExtraInfo(){
 const value=document.getElementById('extraText').value.trim();if(!value){alert('Vul eerst de extra informatie in.');return}
 const all=getExtraInfo();all[extraLocationId]=all[extraLocationId]||[];
 all[extraLocationId].push({date:document.getElementById('extraDate').value,text:value});
 localStorage.setItem('ruinekerk_extra_info_v1',JSON.stringify(all));
 document.getElementById('extraText').value='';renderExtraExisting();renderExtraOnCard(extraLocationId);
}
function renderExtraExisting(){
 const items=getExtraInfo()[extraLocationId]||[];
 document.getElementById('extraExisting').innerHTML=items.length?'<h3>Extra informatie</h3>'+items.map(n=>'<div class="extra-item"><div class="extra-date">'+esc(n.date)+'</div>'+esc(n.text)+'</div>').join(''):'<p class="meta">Nog geen extra informatie toegevoegd.</p>';
}
function renderExtraOnCard(id){
 const el=document.getElementById('extra-'+id);if(!el)return;
 const items=getExtraInfo()[id]||[];el.innerHTML=items.map(n=>'<div class="extra-item"><div class="extra-date">'+esc(n.date)+'</div>'+esc(n.text)+'</div>').join('');
}
function renderAllExtraInfo(){locations.forEach(x=>renderExtraOnCard(x.id));}

function getUserLocations(){
 try{return JSON.parse(localStorage.getItem('ruinekerk_user_locations_v1')||'[]')}catch(e){return []}
}
function setUserLocations(items){
 localStorage.setItem('ruinekerk_user_locations_v1',JSON.stringify(items));
}
function openAddLocation(){
 document.getElementById('newName').value='';
 document.getElementById('newAddress').value='';
 document.getElementById('newType').value='bezienswaardigheid';
 document.getElementById('geocodeResult').textContent='';
 window.pendingGeocode=null;
 document.getElementById('addLocationModal').style.display='block';
}
function closeAddLocation(){document.getElementById('addLocationModal').style.display='none'}

async function findAddress(){
 const address=document.getElementById('newAddress').value.trim();
 if(!address){alert('Vul eerst een adres in.');return}
 const result=document.getElementById('geocodeResult');
 result.textContent='Adres wordt gezocht…';
 try{
  const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=nl&q='+encodeURIComponent(address);
  const response=await fetch(url,{headers:{'Accept':'application/json'}});
  if(!response.ok)throw new Error();
  const data=await response.json();
  if(!data.length){
   result.textContent='Adres niet gevonden. Probeer straat, huisnummer, postcode en plaats.';
   return;
  }
  const p=data[0];
  window.pendingGeocode={lat:Number(p.lat),lon:Number(p.lon)};
  result.textContent='✓ Gevonden: '+p.display_name+' · '+Number(p.lat).toFixed(5)+', '+Number(p.lon).toFixed(5);
 }catch(e){
  result.textContent='Adres zoeken is mislukt. Controleer je internetverbinding of probeer een uitgebreider adres.';
 }
}

function saveNewLocation(){
 const name=document.getElementById('newName').value.trim();
 const address=document.getElementById('newAddress').value.trim();
 const type=document.getElementById('newType').value;
 if(!name){alert('Vul een naam in.');return}
 if(!address){alert('Vul een adres in.');return}
 if(!window.pendingGeocode){alert('Klik eerst op “Adres zoeken”.');return}

 const item={
  id:'user-'+Date.now(),
  name:name,
  type:type,
  address:address,
  lat:window.pendingGeocode.lat,
  lon:window.pendingGeocode.lon,
  coordinate_status:'geocoded_from_address',
  added_at:new Date().toISOString()
 };
 const user=getUserLocations();
 user.push(item);
 setUserLocations(user);
 locations.push(item);
 drawMarkers();
 closeAddLocation();
 render();
 map.setView([item.lat,item.lon],16);
 alert('Locatie toegevoegd. Deze locatie wordt lokaal op dit apparaat bewaard.');
}

let extraLocationId=null;
function getExtraInfo(){
 try{return JSON.parse(localStorage.getItem('ruinekerk_extra_info_v1')||'{}')}catch(e){return {}}
}
function openExtraInfo(id){
 extraLocationId=id;
 const x=locations.find(a=>a.id===id);
 document.getElementById('extraTitle').textContent='➕ Extra informatie – '+(x?x.name:'Locatie');
 document.getElementById('extraDate').value=new Date().toISOString().slice(0,10);
 document.getElementById('extraText').value='';
 renderExtraExisting();
 document.getElementById('extraModal').style.display='block';
}
function closeExtraInfo(){document.getElementById('extraModal').style.display='none'}
function saveExtraInfo(){
 const value=document.getElementById('extraText').value.trim();
 if(!value){alert('Vul eerst de extra informatie in.');return}
 const all=getExtraInfo();
 all[extraLocationId]=all[extraLocationId]||[];
 all[extraLocationId].push({
  date:document.getElementById('extraDate').value,
  text:value
 });
 localStorage.setItem('ruinekerk_extra_info_v1',JSON.stringify(all));
 document.getElementById('extraText').value='';
 renderExtraExisting();
 renderExtraOnCard(extraLocationId);
}
function renderExtraExisting(){
 const items=getExtraInfo()[extraLocationId]||[];
 document.getElementById('extraExisting').innerHTML=items.length?
  '<h3>Extra informatie</h3>'+items.map(n=>'<div class="extra-item"><div class="extra-date">'+esc(n.date)+'</div>'+esc(n.text)+'</div>').join(''):
  '<p class="meta">Nog geen extra informatie toegevoegd.</p>';
}
function renderExtraOnCard(id){
 const el=document.getElementById('extra-'+id);if(!el)return;
 const items=getExtraInfo()[id]||[];
 el.innerHTML=items.map(n=>'<div class="extra-item"><div class="extra-date">'+esc(n.date)+'</div>'+esc(n.text)+'</div>').join('');
}
function renderAllExtraInfo(){locations.forEach(x=>renderExtraOnCard(x.id));}

let noteLocationId=null;
function getNotes(){try{return JSON.parse(localStorage.getItem('ruinekerk_notes_v1')||'{}')}catch(e){return {}}}
function openNote(id){
 noteLocationId=id;const x=locations.find(a=>a.id===id);
 document.getElementById('noteTitle').textContent='📝 '+(x?x.name:'Locatie');
 document.getElementById('noteType').value='opmerking';
 document.getElementById('noteDate').value=new Date().toISOString().slice(0,10);
 document.getElementById('noteText').value='';
 renderExistingNotes();document.getElementById('noteModal').style.display='block';
}
function closeNote(){document.getElementById('noteModal').style.display='none'}
function saveNote(){
 const value=document.getElementById('noteText').value.trim();if(!value){alert('Vul eerst een tekst in.');return}
 const all=getNotes();all[noteLocationId]=all[noteLocationId]||[];
 all[noteLocationId].push({type:document.getElementById('noteType').value,date:document.getElementById('noteDate').value,text:value});
 localStorage.setItem('ruinekerk_notes_v1',JSON.stringify(all));
 document.getElementById('noteText').value='';renderExistingNotes();renderNotesOnCard(noteLocationId);
}
function renderExistingNotes(){
 const notes=getNotes()[noteLocationId]||[];
 document.getElementById('noteExisting').innerHTML=notes.length?'<h3>Mijn notities</h3>'+notes.map(n=>'<div class="note"><div class="notehead">'+esc(n.type)+' · '+esc(n.date)+'</div>'+esc(n.text)+'</div>').join(''):'<p class="meta">Nog geen notities.</p>';
}
function renderNotesOnCard(id){
 const el=document.getElementById('notes-'+id);if(!el)return;
 const notes=getNotes()[id]||[];
 el.innerHTML=notes.map(n=>'<div class="note"><div class="notehead">'+esc(n.type)+' · '+esc(n.date)+'</div>'+esc(n.text)+'</div>').join('');
}
function renderAllNotes(){locations.forEach(x=>renderNotesOnCard(x.id));}

function testPosition(){
 userLat=52.719804;userLon=4.878203;updateUserMarker();map.setView([userLat,userLon],15);render();
}
function myPosition(){
 if(!navigator.geolocation){alert('GPS wordt niet ondersteund.');return;}
 navigator.geolocation.getCurrentPosition(
  p=>{userLat=p.coords.latitude;userLon=p.coords.longitude;updateUserMarker();map.setView([userLat,userLon],16);render();},
  ()=>alert('Locatie kon niet worden bepaald. Controleer de locatie-toestemming.')
 );
}
function showAll(){if(markers.length)map.fitBounds(L.featureGroup(markers).getBounds().pad(.25));}
loadLocations();
</script>
</body>
</html>
