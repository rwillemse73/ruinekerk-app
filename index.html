<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trekvogelpad-app 5.2</title>
<style>
body{margin:0;font-family:Calibri,"Segoe UI",Arial,sans-serif;color:#292724;background:#f5f2ed}
header{background:#fff;border-bottom:1px solid #ddd;padding:15px;position:sticky;top:0;z-index:10}
h1{margin:0;color:#5b4636;font-size:23px}.sub{font-size:12px;color:#777}.v{float:right;background:#eee;padding:5px 8px;border-radius:12px;font-size:11px}
.panel{max-width:900px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:13px;margin:10px 0}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #bbb;border-radius:8px;margin:5px 0}
button{border:0;border-radius:9px;padding:9px 12px;background:#5b4636;color:#fff;margin:3px}
.status,.meta{font-size:12px;color:#777}.story{font-size:14px;line-height:1.55}.error{background:#ffe4e4;padding:10px;border-radius:8px}
</style>
</head>
<body>
<header><span class="v">v5.2</span><h1>🎨 Trekvogelpad-app</h1><div class="sub">Kunst · OneDrive</div></header>
<div class="panel">
<div class="card">
<b>Bron kunst.json</b>
<div class="meta">De JSON bepaalt welke locaties bestaan en bevat de GPS-coördinaten.</div>
<input id="source" placeholder="URL naar kunst.json">
<button onclick="save()">Opslaan en laden</button>
<button onclick="load()">Opnieuw laden</button>
<div id="sourceStatus" class="status">Geen bron geladen.</div>
</div>
<button onclick="getGPS()">📍 Mijn GPS</button>
<button onclick="testGPS()">🧪 Testpositie</button>
<div id="status" class="status"></div>
<div id="locations"></div>
</div>
<script>
const KEY="trekvogelpad_5_2_kunst_json";
let locations=[],position=null;

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function distance(lat1,lon1,lat2,lon2){
 const R=6371000,p=Math.PI/180,a=(lat2-lat1)*p,b=(lon2-lon1)*p;
 const q=Math.sin(a/2)**2+Math.cos(lat1*p)*Math.cos(lat2*p)*Math.sin(b/2)**2;
 return 2*R*Math.atan2(Math.sqrt(q),Math.sqrt(1-q));
}
function fmt(m){return m<1000?Math.round(m)+" meter":(m/1000).toFixed(1)+" km";}

function save(){
 const u=document.getElementById("source").value.trim();
 localStorage.setItem(KEY,u); load();
}

async function load(){
 const u=localStorage.getItem(KEY)||document.getElementById("source").value.trim();
 if(!u){document.getElementById("sourceStatus").textContent="Vul eerst de URL van kunst.json in.";return;}
 document.getElementById("source").value=u;
 try{
   const r=await fetch(u+(u.includes("?")?"&":"?")+"v="+Date.now(),{cache:"no-store"});
   if(!r.ok)throw Error("HTTP "+r.status);
   const j=await r.json();
   locations=j.locations||[];
   document.getElementById("sourceStatus").textContent="✓ "+locations.length+" kunstlocaties geladen.";
   render();
 }catch(e){
   document.getElementById("sourceStatus").innerHTML='<div class="error">kunst.json kan niet worden gelezen: '+esc(e.message)+'</div>';
 }
}

function setPosition(lat,lon){position={lat,lon};render();}
function testGPS(){setPosition(52.03693393,5.33967522);}
function getGPS(){
 if(!navigator.geolocation){alert("GPS wordt niet ondersteund.");return;}
 navigator.geolocation.getCurrentPosition(
  p=>setPosition(p.coords.latitude,p.coords.longitude),
  ()=>alert("GPS kon niet worden bepaald.")
 );
}

async function readHTML(location){
 const jsonURL=localStorage.getItem(KEY);
 const htmlURL=new URL(location.html,new URL(jsonURL)).href;
 const r=await fetch(htmlURL+(htmlURL.includes("?")?"&":"?")+"v="+Date.now(),{cache:"no-store"});
 if(!r.ok)throw Error("HTML HTTP "+r.status);
 const t=await r.text();
 const d=new DOMParser().parseFromString(t,"text/html");
 const main=d.querySelector("main")||d.body;
 return main.innerHTML;
}

async function render(){
 const box=document.getElementById("locations");
 if(!position){
  box.innerHTML='<div class="card">Gebruik 📍 Mijn GPS of 🧪 Testpositie.</div>';
  return;
 }
 const nearby=locations
  .map(x=>({...x,distance:distance(position.lat,position.lon,+x.latitude,+x.longitude)}))
  .filter(x=>Number.isFinite(x.distance)&&x.distance<=500)
  .sort((a,b)=>a.distance-b.distance);

 document.getElementById("status").textContent=
  nearby.length+" kunstlocatie(s) binnen 500 meter · 250 meter = verhaalzone";

 if(!nearby.length){
  box.innerHTML='<div class="card">Geen kunstlocaties binnen 500 meter.</div>';
  return;
 }

 box.innerHTML=nearby.map((x,i)=>`
 <div class="card">
   <h2>${esc(x.naam)}</h2>
   <div class="meta">${fmt(x.distance)}</div>
   <div id="story${i}" class="story">
     ${x.distance<=250?"Verhaal laden…":"Binnen 500 m, buiten de 250 m verhaalzone."}
   </div>
 </div>`).join("");

 for(let i=0;i<nearby.length;i++){
  if(nearby[i].distance<=250){
   try{
    document.getElementById("story"+i).innerHTML=await readHTML(nearby[i]);
   }catch(e){
    document.getElementById("story"+i).innerHTML=
      '<div class="error">HTML kan niet worden geladen: '+esc(e.message)+'</div>';
   }
  }
 }
}

const saved=localStorage.getItem(KEY);
if(saved)document.getElementById("source").value=saved;
load();
</script>
</body>
</html>
